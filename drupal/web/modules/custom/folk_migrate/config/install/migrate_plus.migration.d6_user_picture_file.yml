id: d6_user_picture_file
label: 'User pictures'
migration_tags:
  - Drupal 6
  - Content
source:
  plugin: d6_user_picture_file
  constants:
    is_public: true
    source_base_path: 'http://folk.sk'
process:
  filename: filename
  uid: uid
  source_full_path:
    -
      plugin: concat
      delimiter: /
      source:
        - constants/source_base_path
        - picture
    -
      plugin: urlencode
  destination_full_path:
    plugin: file_uri
    source:
      - picture
      - file_directory_path
      - temp_directory_path
      - 'constants/is_public'
  uri:
    plugin: file_copy
    source:
      - '@source_full_path'
      - '@destination_full_path'
destination:
  plugin: entity:file
migration_dependencies:
  optional:
    - d6_file