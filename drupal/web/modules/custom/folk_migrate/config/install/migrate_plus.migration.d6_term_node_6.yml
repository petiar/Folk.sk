id: d6_term_node_6
label: 'Term/node relationships - Mesto (vid 6)'
migration_tags:
  - Drupal 6
  - Content
deriver: Drupal\taxonomy\Plugin\migrate\D6TermNodeDeriver
source:
  plugin: d6_term_node
process:
  nid:
    # Vynechávame d6_node_complete z lookupov — mapa pre akcia obsahuje
    # iba failed záznamy (destid=NULL) čo blokuje fallback na d6_node.
    - plugin: migration_lookup
      migration:
        - d6_node
      source: nid
    - plugin: skip_on_empty
      method: row
  type: type
destination:
  plugin: entity:node
migration_dependencies:
  required:
    - d6_vocabulary_entity_display
    - d6_vocabulary_entity_form_display
    - d6_node
