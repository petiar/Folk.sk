name: 'Štítky pre označenie blogov'
vid: stitky_pre_oznacenie_blogov
description: 'Blogy sa nezaraďujú do kategórií, ale označujú tzv. štítkami (v angličtine Tagy). Každý štítok je jedno slovo, ktoré sa svojim obsahom čo najviac týka témy článku. Napríklad pre reportáž z koncertu pesničkára môžte uviesť štítky "koncert" a "pesničkár".'
