description: '<em>Príspevok na blog</em> je jednoduchý samostatný článok, ktorý sa zobrazuje na príslušných stránkach. Ide väčšinou o osobné zápisky, či postrehy. Boli by sme veľmi radi keby mali niečo spoločné s hudbou všeobecne a potešíme sa i zápiskom z kuchyne vašej kapely. Administrátori všetky blogy pozorne čítajú a niektoré následne uverejňujú aj na hlavnej stránke.'
